{% extends "base.html" %}
{% block title %}Mark Attendance{% endblock %}
{% block content %}
<h3 class="mb-4">Mark Attendance — {{ employee.get_full_name|default:employee.username }}</h3>
<div class="card" style="max-width: 480px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Date</label>
                <input type="date" name="date" value="{{ date }}" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    {% for value, label in status_choices %}
                    <option value="{{ value }}" {% if record.status == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Notes</label>
                <textarea name="notes" class="form-control" rows="2">{{ record.notes|default:"" }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'attendance:all_attendance' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
